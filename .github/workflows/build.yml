# Builds and tests SpaceDeck on Windows and produces the installer (MSI + SHA256SUMS.txt) as a build artifact.
#
# Releasing (any of these):
#   - Raise <Version> in Directory.Build.props and push to main: when no release v<Version> exists yet, the run
#     creates tag v<Version> and publishes the release. (Pushes that keep the same version just build.)
#   - Actions -> Build -> Run workflow, enter a version (e.g. 0.1.1): builds it, creates tag v0.1.1 and the release.
#   - Push a tag like v0.1.1.
#   - Publish a release with a new v* tag on GitHub's website: the run for that tag attaches the files to it.
# A version with a suffix (0.2.0-beta.1) gives a pre-release, which the app's update check ignores.
# Release notes come from the version's section in CHANGELOG.md (scripts/Get-ReleaseNotes.ps1): write it before
# raising the version. Every push to main also brings the notes of existing releases in line with CHANGELOG.md.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version to publish, e.g. 0.1.1 (leave empty to just build)'
        required: false
        default: ''

permissions:
  contents: write   # creating tags and releases

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.release_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = 'false'
          if ($env:INPUT_VERSION) {
            $v = $env:INPUT_VERSION.Trim().TrimStart('v', 'V'); $release = 'true'
          } elseif ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.Substring(1); $release = 'true'
          } else {
            $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
            # A push to main with a version that has no release yet publishes it.
            if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main') {
              gh release view "v$v" *> $null
              if ($LASTEXITCODE -ne 0) { $release = 'true' }
              $global:LASTEXITCODE = 0
            }
          }
          if ($v -notmatch '^\d+\.\d+\.\d+([-+][0-9A-Za-z.\-]+)?$') { throw "Not a version: '$v'" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v (release: $release)"

      - name: Build
        run: dotnet build SpaceDeck.slnx -c Release

      - name: Test
        run: dotnet test SpaceDeck.slnx -c Release --no-build

      - name: Installer
        shell: pwsh
        run: ./scripts/Build-Installer.ps1 -Version '${{ steps.version.outputs.version }}'

      - uses: actions/upload-artifact@v4
        with:
          name: SpaceDeck-${{ steps.version.outputs.version }}-installer
          path: artifacts/installer/*
          if-no-files-found: error

      - name: Release
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $tag = "v$v"
          $files = (Get-ChildItem artifacts/installer/*).FullName
          ./scripts/Get-ReleaseNotes.ps1 -Version $v -OutFile release-notes.md
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag exists: attaching the installer"
            gh release upload $tag @files --clobber
          } else {
            $flags = @('--title', "SpaceDeck $v", '--notes-file', 'release-notes.md', '--target', $env:GITHUB_SHA)
            if ($v -match '-') { $flags += '--prerelease' }
            gh release create $tag @files @flags
          }
          if ($LASTEXITCODE -ne 0) { throw "Publishing $tag failed." }

  # Keeps every published release's notes equal to its CHANGELOG.md section (fixes typos, fills in old releases).
  release-notes:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          foreach ($v in ./scripts/Get-ReleaseNotes.ps1 -ListVersions) {
            gh release view "v$v" --json body --jq .body > current.md 2> $null
            if ($LASTEXITCODE -ne 0) { Write-Host "v${v}: no release yet"; $global:LASTEXITCODE = 0; continue }
            ./scripts/Get-ReleaseNotes.ps1 -Version $v -OutFile wanted.md
            if ((Get-Content current.md -Raw).Trim() -eq (Get-Content wanted.md -Raw).Trim()) { Write-Host "v${v}: up to date"; continue }
            gh release edit "v$v" --notes-file wanted.md
            if ($LASTEXITCODE -ne 0) { throw "Updating the notes of v$v failed." }
            Write-Host "v${v}: notes updated"
          }
