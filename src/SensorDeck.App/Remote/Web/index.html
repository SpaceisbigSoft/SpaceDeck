<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SensorDeck</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #111; --surface: #1a1a1a; --text: #f5f5f4; --muted: #a8a29e; --faint: #57534e; --accent: #c2410c; --on-accent: #fff;
    --track: #2a2a2a; --rule: #333; --grid: #222; --ok: #16a34a; --warning: #d97706; --critical: #dc2626;
    --card-bg: transparent; --card-border: #333; --card-border-width: 1px 0 0 0; --radius: 0px;
    --font-display: "Segoe UI", system-ui, sans-serif; --font-body: "Segoe UI", system-ui, sans-serif; --font-mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 18px 8px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
  header .brand { font-weight: 600; letter-spacing: .02em; margin-right: 8px; }
  .tabs { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; min-width: 0; }
  .tab { background: none; border: 0; color: var(--muted); font: inherit; padding: 6px 10px; cursor: pointer; border-bottom: 2px solid transparent; }
  .tab.on { color: var(--text); border-bottom-color: var(--accent); }
  .right { display: flex; align-items: center; gap: 10px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .dot.live { background: var(--ok); }
  select, button.btn, input { background: var(--surface); color: var(--text); border: 1px solid var(--rule); border-radius: 4px; padding: 6px 10px; font: inherit; }
  button.btn { cursor: pointer; }
  button.btn.accent { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  main { flex: 1; overflow: auto; padding: 18px; }
  .grid { display: grid; gap: 12px; grid-auto-rows: 36px; }
  .tile { background: var(--card-bg); border-style: solid; border-color: var(--card-border); border-width: var(--card-border-width); border-radius: var(--radius);
          padding: 10px 2px 4px; overflow: hidden; min-width: 0; display: flex; flex-direction: column; }
  .tile.bare { border-width: 0; background: none; justify-content: flex-end; }
  .title { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
  .caption { font-family: var(--font-mono); font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hero { font-family: var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; line-height: 1.05; }
  .hero .unit { font-size: 14px; color: var(--muted); margin-left: 4px; }
  .bar { height: 4px; background: var(--track); margin: 8px 0; position: relative; flex: none; }
  .bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--text); transition: width .3s; }
  .rows { overflow: auto; flex: 1; }
  .row { display: grid; grid-template-columns: 1fr auto 64px; align-items: center; gap: 12px; min-height: 30px; font-size: 14px; }
  .row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .val { font-family: var(--font-mono); font-size: 13px; text-align: right; }
  .row .bar { margin: 0; }
  .section { display: grid; grid-template-columns: 1fr auto auto auto; column-gap: 12px; row-gap: 2px; font-size: 14px; overflow: auto; }
  .section-label { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .section-val { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .section-heading { grid-column: 1 / -1; margin-top: 8px; }
  .row2 { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; padding: 4px 0; }
  .row2 .sub { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
  svg { display: block; width: 100%; flex: 1; min-height: 0; overflow: visible; }
  .cores { display: flex; flex-direction: column; gap: 6px; overflow: auto; }
  .cells { display: flex; flex-wrap: wrap; gap: 3px; }
  .cell { width: 46px; height: 38px; border-radius: 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--font-mono); }
  .cell b { font-size: 13px; font-weight: 400; } .cell small { font-size: 9px; opacity: .7; }
  .profiles { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .profiles .btn.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .missing { color: var(--muted); font-size: 14px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; margin-top: 6px; }
  .legend span::before { content: ""; display: inline-block; width: 12px; height: 2px; margin-right: 6px; vertical-align: middle; background: var(--c); }
  .center { margin: auto; max-width: 360px; padding: 32px 20px; text-align: center; }
  .center h1 { font-weight: 600; font-size: 22px; }
  .center p { color: var(--muted); }
  .center input { width: 100%; font-size: 28px; letter-spacing: .3em; text-align: center; margin: 12px 0; }
  .err { color: var(--critical); min-height: 1.4em; }
  @media (max-width: 640px) {
    header { padding: 8px 10px 0; } main { padding: 10px; }
    .brand { flex: 1; }
    .tabs { order: 3; flex: 0 0 100%; flex-wrap: nowrap; overflow-x: auto; }
    .tab { white-space: nowrap; }
  }
</style>
</head>
<body>
<header id="bar" hidden>
  <span class="brand">SensorDeck</span>
  <nav class="tabs" id="tabs"></nav>
  <div class="right">
    <select id="profile" hidden aria-label="Fan profile"></select>
    <span class="dot" id="dot" title="Live"></span>
    <button class="btn" id="fs" title="Full screen">⛶</button>
  </div>
</header>
<main id="main"></main>

<script>
"use strict";
const $ = (sel) => document.querySelector(sel);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const SVGNS = "http://www.w3.org/2000/svg";
const svg = (tag, attrs) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs || {}) e.setAttribute(k, attrs[k]); return e; };

let token = localStorage.getItem("sd.token") || "";
let latest = 0, clockOffset = 0; // PC time of the newest frame; PC clock − this device's clock
let state = null, values = {}, history = {}, updaters = [], stream = null, current = localStorage.getItem("sd.dashboard");
const MAX_POINTS = 3600;

// ── Pairing ──────────────────────────────────────────────────────────
function guessName() {
  const ua = navigator.userAgent;
  if (/Android/i.test(ua)) return "Android device";
  if (/iPhone|iPad/i.test(ua)) return "iPhone / iPad";
  if (/Linux/i.test(ua)) return "Steam Deck";
  return "Browser";
}

function showPairing(message) {
  if (stream) { stream.close(); stream = null; }
  $("#bar").hidden = true;
  const main = $("#main"); main.replaceChildren();
  const box = el("form", "center");
  box.append(el("h1", null, "Connect to SensorDeck"),
             el("p", null, "Enter the PIN shown in SensorDeck → Settings → Network dashboard."));
  const pin = el("input"); pin.inputMode = "numeric"; pin.autocomplete = "one-time-code"; pin.maxLength = 6; pin.placeholder = "000000";
  const name = el("input"); name.value = guessName(); name.style.fontSize = "16px"; name.style.letterSpacing = "0"; name.setAttribute("aria-label", "Device name");
  const err = el("div", "err", message || "");
  const go = el("button", "btn accent", "Connect"); go.type = "submit";
  box.append(pin, name, err, go);
  box.onsubmit = async (e) => {
    e.preventDefault();
    err.textContent = "";
    try {
      const r = await fetch("/api/pair", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin: pin.value, name: name.value }) });
      if (r.status === 423) { err.textContent = "Pairing is locked after too many wrong PINs. Press \"New PIN\" in SensorDeck (Settings, Network dashboard), then enter the new PIN."; return; }
      if (r.status === 429) { err.textContent = "Too many tries. Wait a minute."; return; }
      if (!r.ok) { err.textContent = "Wrong PIN."; return; }
      token = (await r.json()).token;
      localStorage.setItem("sd.token", token);
      start();
    } catch { err.textContent = "Can't reach SensorDeck."; }
  };
  main.append(box);
  pin.focus();
}

// ── Data ─────────────────────────────────────────────────────────────
async function api(path, options) {
  const r = await fetch(path, Object.assign({ headers: { Authorization: "Bearer " + token } }, options || {}));
  if (r.status === 401) { token = ""; localStorage.removeItem("sd.token"); showPairing("This device isn't paired (anymore)."); throw new Error("unauthorized"); }
  return r;
}

async function start() {
  if (!token) { showPairing(); return; }
  try {
    const r = await api("/api/state");
    state = await r.json();
  } catch (e) {
    if (e.message !== "unauthorized") setTimeout(start, 3000);
    return;
  }
  clockOffset = (state.serverNowMs || Date.now()) - Date.now();
  applySkin(state.skin);
  $("#bar").hidden = false;
  if (!state.dashboards.some(d => d.id === current)) current = state.dashboards.length ? state.dashboards[0].id : null;
  renderTabs(); renderProfiles();
  await loadHistory();
  render();
  openStream();
  // Opened before SensorDeck had its sensor list (just started, or the collector reconnecting): ask again shortly.
  if (!Object.keys(state.sensors).length) setTimeout(start, 3000);
}

function openStream() {
  if (stream) stream.close();
  stream = new EventSource("/api/stream?token=" + encodeURIComponent(token));
  stream.addEventListener("values", (e) => {
    const frame = JSON.parse(e.data);
    values = frame.v; latest = frame.t;
    for (const id in history) {
      const h = history[id], x = values[id];
      if (!x) continue;
      h.t.push(frame.t); h.v.push(x[0]);
      if (h.t.length > MAX_POINTS) { h.t.shift(); h.v.shift(); }
    }
    $("#dot").classList.add("live");
    for (const u of updaters) u();
  });
  stream.addEventListener("reload", () => start());
  stream.onerror = () => {
    $("#dot").classList.remove("live");
    // Paired still? (401 sends us back to pairing.)
    api("/api/state").catch(() => {});
  };
}

async function loadHistory() {
  const ids = new Set(); let seconds = 60;
  for (const d of state.dashboards) for (const t of d.tiles) {
    if (t.type === "Chart" || t.type === "Sparkline") { (t.sensors || []).forEach(id => ids.add(id)); seconds = Math.max(seconds, t.windowSeconds || 300); }
  }
  history = {};
  if (!ids.size) return;
  try {
    const r = await api(`/api/history?ids=${encodeURIComponent([...ids].join(","))}&seconds=${Math.min(seconds, 3600)}`);
    const data = await r.json();
    for (const id of ids) history[id] = data[id] ? { t: data[id][0], v: data[id][1] } : { t: [], v: [] };
  } catch { for (const id of ids) history[id] = { t: [], v: [] }; }
}

function applySkin(s) {
  const root = document.documentElement.style;
  const map = { bg: "--bg", surface: "--surface", text: "--text", muted: "--muted", faint: "--faint", accent: "--accent", onAccent: "--on-accent",
                track: "--track", rule: "--rule", grid: "--grid", ok: "--ok", warning: "--warning", critical: "--critical", cardBg: "--card-bg", cardBorder: "--card-border" };
  for (const k in map) if (s[k]) root.setProperty(map[k], s[k]);
  root.setProperty("--card-border-width", s.cardBorderWidth || "1px 0 0 0");
  root.setProperty("--radius", (s.radius || 0) + "px");
  root.setProperty("--font-display", `"${s.fontDisplay}", "Segoe UI", system-ui, sans-serif`);
  root.setProperty("--font-body", `"${s.fontBody}", "Segoe UI", system-ui, sans-serif`);
  root.setProperty("--font-mono", `${s.fontMono.split(",").map(f => `"${f.trim()}"`).join(",")}, ui-monospace, monospace`);
  document.querySelector('meta[name="theme-color"]').content = s.bg;
}

// ── Chrome ───────────────────────────────────────────────────────────
function renderTabs() {
  const tabs = $("#tabs"); tabs.replaceChildren();
  for (const d of state.dashboards) {
    const b = el("button", "tab" + (d.id === current ? " on" : ""), d.name);
    b.onclick = () => { current = d.id; localStorage.setItem("sd.dashboard", d.id); renderTabs(); render(); };
    tabs.append(b);
  }
}

function renderProfiles() {
  const sel = $("#profile");
  sel.hidden = !state.controls || !state.profiles.length;
  sel.replaceChildren(el("option", null, "Fan profile…"));
  for (const p of state.profiles) { const o = el("option", null, p); o.value = p; o.selected = p === state.profile; sel.append(o); }
  sel.onchange = () => switchProfile(sel.value);
}

async function switchProfile(name) {
  if (!name) return;
  try { const r = await api("/api/profile", { method: "POST", headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" }, body: JSON.stringify({ name }) });
        if (r.ok) { state.profile = name; render(); }
        renderProfiles(); } // a refused switch (429 too soon, 409 FanControl failed) snaps the picker back
  catch { /* shown by the dot */ }
}

$("#fs").onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.().catch(() => {}); };

// ── Layout (same 12-column grid as the desktop; fewer columns on small screens) ──
function columns() {
  const w = $("#main").clientWidth - 36;
  return Math.max(2, Math.min(12, Math.floor((w + 12) / 86)));
}

function place(tiles, cols) {
  const sorted = [...tiles].sort((a, b) => a.row - b.row || a.col - b.col);
  if (cols >= 12) return sorted.map(t => ({ t, c: t.col, r: t.row, w: t.colSpan, h: t.rowSpan }));
  const used = []; const free = (r, c, w, h) => { for (let y = r; y < r + h; y++) for (let x = c; x < c + w; x++) if (used[y]?.[x]) return false; return true; };
  return sorted.map(t => {
    // Phones: one tile per row, full width; tablets: the tile's own width (clipped).
    const w = cols <= 6 ? cols : Math.min(t.colSpan, cols), h = t.rowSpan;
    for (let r = 0; ; r++) for (let c = 0; c + w <= cols; c++) if (free(r, c, w, h)) {
      for (let y = r; y < r + h; y++) { used[y] = used[y] || []; for (let x = c; x < c + w; x++) used[y][x] = true; }
      return { t, c, r, w, h };
    }
  });
}

let lastCols = 0;
window.addEventListener("resize", () => { if (state && columns() !== lastCols) render(); });

function render() {
  updaters = [];
  const main = $("#main"); main.replaceChildren();
  const dash = state.dashboards.find(d => d.id === current);
  if (!dash) { main.append(el("div", "center", "No dashboards yet. Make one in SensorDeck.")); return; }
  const cols = lastCols = columns();
  const grid = el("div", "grid"); grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
  for (const p of place(dash.tiles, cols)) {
    const node = tile(p.t, dash.extras[p.t.id]);
    node.style.gridColumn = `${p.c + 1} / span ${p.w}`;
    node.style.gridRow = `${p.r + 1} / span ${p.h}`;
    grid.append(node);
  }
  main.append(grid);
  for (const u of updaters) u();
}

// ── Values ───────────────────────────────────────────────────────────
const S = (id) => state.sensors[id];
const V = (id) => values[id];
const text = (id) => V(id)?.[1] ?? "—";
const split = (t) => { const i = t.indexOf(" "); return i < 0 ? [t, ""] : [t.slice(0, i), t.slice(i + 1)]; };
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

function level(spec, id) {
  const x = V(id); if (!x) return 0;
  if (spec.warning == null && spec.critical == null) return x[2];
  if (x[0] == null) return 0;
  return spec.critical != null && x[0] >= spec.critical ? 2 : spec.warning != null && x[0] >= spec.warning ? 1 : 0;
}

function color(spec, id) {
  const l = level(spec, id);
  return l === 2 ? "var(--critical)" : l === 1 ? "var(--warning)" : spec.accent != null ? state.skin.series[spec.accent % 6] : "var(--text)";
}

function scale(spec, id) {
  const lo = spec.scaleMin ?? 0;
  const hi = spec.scaleMax != null && spec.scaleMax > lo ? spec.scaleMax : Math.max(S(id)?.max ?? 100, lo + 1);
  return [lo, hi];
}

function fraction(spec, id) {
  const x = V(id); if (!x || x[0] == null) return 0;
  const [lo, hi] = scale(spec, id);
  return Math.max(0, Math.min(1, (x[0] - lo) / (hi - lo)));
}

function bar(update) {
  const b = el("div", "bar"), i = el("i"); b.append(i);
  updaters.push(() => update(i));
  return b;
}

// ── Tiles ────────────────────────────────────────────────────────────
function defaultTitle(t) {
  const first = (t.sensors || []).map(S).find(Boolean);
  switch (t.type) {
    case "Rails": return "Voltage rails";
    case "Fans": return "Fans & pump";
    case "Chart": return (t.sensors || []).length === 1 && first ? first.n : "History";
    case "List": return "Sensors";
    case "FanProfiles": return "Fan profile";
    case "CoreMap": return { temperature: "Temperature per core", clock: "Clock per core" }[t.metric] || "Load per thread";
    case "Uptime": return "Windows uptime";
    case "Throughput": return "Network & disk";
    case "Section": return { cpu: "CPU", gpu: "GPU", memory: "RAM", storage: "Drives", network: "Network", motherboard: "Motherboard", battery: "Battery" }[t.section] || "Section";
    case "Label": case "Clock": case "Text": return "";
    default: return first ? first.n : "Sensor";
  }
}

const NO_SENSOR = ["Label", "FanProfiles", "CoreMap", "Clock", "Uptime", "Throughput", "Section"];

function tile(t, extra) {
  const node = el("div", "tile");
  const title = t.title ?? defaultTitle(t);
  const ids = (t.sensors || []).filter(id => S(id));
  if (title && t.type !== "Label") node.append(el("div", "title", title));
  if (!NO_SENSOR.includes(t.type) && !ids.length) {
    node.append(el("div", "missing", Object.keys(state.sensors).length ? "Sensor not found" : "Waiting for sensors…"));
    return node;
  }
  const id = ids[0];
  switch (t.type) {
    case "BigNumber": {
      const hero = el("div", "hero"), num = el("span"), unit = el("span", "unit");
      hero.style.fontSize = (t.rowSpan >= 5 ? 64 : t.rowSpan === 4 ? 52 : 34) + "px"; hero.append(num, unit);
      const mm = el("div", "caption");
      node.append(hero, bar(i => { i.style.width = fraction(t, id) * 100 + "%"; i.style.background = color(t, id); }));
      if (t.showMinMax !== false) node.append(mm);
      updaters.push(() => { const [n, u] = split(text(id)); num.textContent = n; unit.textContent = u; hero.style.color = color(t, id);
                            const x = V(id); mm.textContent = x ? `min ${x[3]} · max ${x[4]}` : ""; });
      break;
    }
    case "Gauge": {
      const s = svg("svg", { viewBox: "0 0 100 86" });
      const arc = (f) => { const a0 = Math.PI * 0.75, a = a0 + f * Math.PI * 1.5, r = 40, cx = 50, cy = 50;
        const p = (ang) => `${cx + r * Math.cos(ang)} ${cy + r * Math.sin(ang)}`;
        return f <= 0.0005 ? "" : `M ${p(a0)} A ${r} ${r} 0 ${f > 2 / 3 ? 1 : 0} 1 ${p(a)}`; };
      const track = svg("path", { d: arc(1), fill: "none", stroke: "var(--track)", "stroke-width": 7, "stroke-linecap": "butt" });
      const fill = svg("path", { fill: "none", "stroke-width": 7 });
      const num = svg("text", { x: 50, y: 52, "text-anchor": "middle", "font-size": 18, fill: "var(--text)", "font-family": "var(--font-display)" });
      const unit = svg("text", { x: 50, y: 66, "text-anchor": "middle", "font-size": 8, fill: "var(--muted)" });
      s.append(track, fill, num, unit); node.append(s);
      updaters.push(() => { fill.setAttribute("d", arc(fraction(t, id))); fill.setAttribute("stroke", color(t, id));
                            const [n, u] = split(text(id)); num.textContent = n; unit.textContent = u; });
      break;
    }
    case "Bar": {
      const line = el("div", "row2"), v = el("span", "hero"); v.style.fontSize = "26px"; line.append(v); node.append(line);
      node.append(bar(i => { i.style.width = fraction(t, id) * 100 + "%"; i.style.background = color(t, id); }));
      updaters.push(() => { v.textContent = text(id); v.style.color = color(t, id); });
      break;
    }
    case "Sparkline": {
      const v = el("div", "hero"); v.style.fontSize = (t.rowSpan >= 6 ? 52 : 30) + "px"; node.append(v);
      const s = svg("svg", { preserveAspectRatio: "none" }); node.append(s);
      updaters.push(() => { v.textContent = text(id); v.style.color = color(t, id); drawLines(s, [id], t.windowSeconds || 300, [color(t, id)], false); });
      break;
    }
    case "Chart": {
      const s = svg("svg", { preserveAspectRatio: "none" }); node.append(s);
      const colors = ids.map((_, i) => state.skin.series[((t.accent ?? 0) + i) % 6]);
      const legend = el("div", "legend"); ids.forEach((x, i) => { const sp = el("span", null, S(x).n); sp.style.setProperty("--c", colors[i]); legend.append(sp); });
      if (ids.length > 1) node.append(legend);
      updaters.push(() => drawLines(s, ids, t.windowSeconds || 300, colors, true));
      break;
    }
    case "Rails": rows(node, ids, (x) => {
      const nom = S(x).nom, v = V(x)?.[0];
      if (nom == null || v == null || nom === 0) return { sub: "", frac: 0, col: "var(--text)" };
      const dev = (v - nom) / Math.abs(nom); const a = Math.abs(dev);
      return { sub: (dev >= 0 ? "+" : "") + (dev * 100).toFixed(1) + " %", frac: Math.min(1, a / 0.1), col: a > 0.08 ? "var(--critical)" : a > 0.05 ? "var(--warning)" : "var(--ok)" };
    }); break;
    case "Fans": rows(node, ids, (x) => { const duty = extra?.[x]; return { sub: duty ? text(duty) : "", frac: fraction({}, x), col: color(t, x) }; }); break;
    case "List": rows(node, ids, (x) => ({ sub: "", frac: fraction(t, x), col: color(t, x) })); break;
    case "Throughput": {
      const list = (extra || []).filter(S);
      if (!list.length) node.append(el("div", "missing", "No transfer-rate sensors. Turn on Drives / Network adapters in SensorDeck → Settings → Collector."));
      rows(node, list, (x) => ({ sub: S(x).g, frac: -1, col: "var(--text)" }));
      break;
    }
    case "Label": {
      node.classList.add("bare");
      if (title) { const h = el("div", null, title); h.style.fontSize = "16px"; h.style.fontWeight = "600"; node.append(h); }
      if (t.text) node.append(el("div", "title", t.text));
      break;
    }
    case "FanProfiles": {
      const box = el("div", "profiles");
      if (!state.profiles.length) box.append(el("div", "missing", "FanControl not found"));
      for (const p of state.profiles) {
        const b = el("button", "btn" + (p === state.profile ? " on" : ""), p);
        b.disabled = !state.controls; b.title = state.controls ? "" : "Turn on remote control in SensorDeck → Settings → Network dashboard";
        b.onclick = () => switchProfile(p); box.append(b);
      }
      node.append(box);
      break;
    }
    case "CoreMap": {
      const wrap = el("div", "cores");
      if (!extra || !extra.groups.some(g => g.cells.length)) wrap.append(el("div", "missing", "No per-core sensors found."));
      for (const g of extra?.groups || []) {
        if (g.label) wrap.append(el("div", "caption", g.label));
        const cells = el("div", "cells");
        for (const [cid, label] of g.cells) {
          const c = el("div", "cell"), b = el("b"), sm = el("small", null, label); c.append(b, sm); c.title = S(cid)?.n || cid; cells.append(c);
          updaters.push(() => { const x = V(cid); const v = x?.[0];
            b.textContent = v == null ? "–" : S(cid).k === "Clock" ? (v / 1000).toFixed(1) : S(cid).k === "Temperature" ? split(text(cid))[0].split(/[.,]/)[0] + "°" : Math.round(v);
            const f = v == null ? 0 : Math.max(0, Math.min(1, (v - extra.low) / Math.max(1e-6, extra.high - extra.low)));
            const hot = S(cid).k === "Temperature" && v >= 95 ? "critical" : S(cid).k === "Temperature" && v >= 85 ? "warning" : "accent";
            c.style.background = mix(css("--track"), css("--" + hot), 0.15 + 0.85 * f);
            c.style.color = f > 0.55 ? css("--on-accent") : css("--text"); });
        }
        wrap.append(cells);
      }
      node.append(wrap);
      break;
    }
    case "Clock": {
      const h = el("div", "hero"); h.style.fontSize = (t.rowSpan >= 4 ? 52 : 34) + "px"; const d = el("div", "caption");
      node.append(h, d); node.style.justifyContent = "center";
      const hour12 = state.clock === "12" ? true : state.clock === "24" ? false : undefined;
      const tick = () => { const n = new Date(); h.textContent = n.toLocaleTimeString([], { hour: "numeric", minute: "2-digit", hour12 });
                           d.textContent = n.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" }); };
      tick(); updaters.push(tick);
      break;
    }
    case "Uptime": {
      const h = el("div", "hero"); h.style.fontSize = "28px"; const since = el("div", "caption"); node.append(h, since);
      const tick = () => { const ms = Date.now() + clockOffset - state.bootMs, d = Math.floor(ms / 864e5), hr = Math.floor(ms / 36e5) % 24, mi = Math.floor(ms / 6e4) % 60;
                           h.textContent = (d ? `${d} d ` : "") + `${hr} h ${String(mi).padStart(2, "0")} min`;
                           since.textContent = "since " + new Date(state.bootMs).toLocaleString([], { dateStyle: "short", timeStyle: "short", hour12: state.clock === "12" ? true : state.clock === "24" ? false : undefined }); };
      tick(); updaters.push(tick);
      break;
    }
    case "Text": {
      const line = el("div"); line.style.fontFamily = "var(--font-mono)"; line.style.fontSize = "18px"; node.append(line); node.style.justifyContent = "center";
      updaters.push(() => {
        line.textContent = t.text
          ? t.text.replace(/\{(\d+)(:name)?\}/g, (m, n, nm) => { const sid = (t.sensors || [])[n - 1]; return !sid || !S(sid) ? "–" : nm ? S(sid).n : text(sid); })
          : ids.map(x => `${S(x).n} ${text(x)}`).join("   ·   ");
      });
      break;
    }
    case "Section": {
      // Rows of label + up to three values, right-aligned in shared columns (like the desktop sidebar).
      if (extra?.name && t.title == null) { const h = node.querySelector(".title"); if (h) h.textContent = extra.name; }
      const grid = el("div", "section");
      if (!extra || !extra.rows.length) { const m = el("div", "missing", "Nothing to show"); m.style.gridColumn = "1 / -1"; grid.append(m); }
      for (const r of extra?.rows || []) {
        if (r.heading) { const h = el("div", "section-heading", r.label); grid.append(h); continue; }
        const label = el("div", "section-label", r.label); grid.append(label);
        if (r.gap) label.style.marginTop = "8px";
        const ids3 = [null, null, null]; r.ids.slice(0, 3).forEach((sid, i, all) => { ids3[3 - all.length + i] = sid; });
        for (const sid of ids3) {
          const v = el("div", "section-val"); grid.append(v); if (r.gap) v.style.marginTop = "8px";
          if (sid) updaters.push(() => { v.textContent = S(sid) ? text(sid) : "–"; v.style.color = color({}, sid); });
        }
      }
      node.append(grid);
      break;
    }
    default: node.append(el("div", "missing", t.type));
  }
  return node;
}

function rows(node, ids, extra) {
  const box = el("div", "rows");
  for (const x of ids) {
    const r = el("div", "row"), name = el("div", "name", S(x).n), val = el("div", "val"), b = el("div", "bar"), i = el("i"); b.append(i);
    const sub = el("div", "caption");
    const left = el("div"); left.style.minWidth = "0"; left.append(name, sub);
    r.append(left, val, b); box.append(r);
    updaters.push(() => { const e = extra(x); val.textContent = text(x); sub.textContent = e.sub; sub.style.display = e.sub ? "" : "none";
                          b.style.visibility = e.frac < 0 ? "hidden" : ""; i.style.width = Math.max(0, e.frac) * 100 + "%"; i.style.background = e.col; val.style.color = e.col === "var(--ok)" ? "" : e.col; });
  }
  node.append(box);
}

function drawLines(s, ids, windowSeconds, colors, axes) {
  const w = s.clientWidth || 300, h = s.clientHeight || 100;
  s.setAttribute("viewBox", `0 0 ${w} ${h}`); s.replaceChildren();
  // Anchor on the PC's clock (the data's), not this device's, which may be off.
  const now = Math.max(...ids.map(id => history[id]?.t.at(-1) ?? 0), latest, Date.now() + clockOffset - 2000), since = now - windowSeconds * 1000;
  let lo = Infinity, hi = -Infinity;
  for (const id of ids) { const hs = history[id]; if (!hs) continue; hs.t.forEach((t, i) => { const v = hs.v[i]; if (t >= since && v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }); }
  if (!isFinite(lo)) { lo = 0; hi = 1; } if (hi - lo < 1e-6) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  const left = axes ? 34 : 0, bottom = axes ? 14 : 0;
  const X = (t) => left + (t - since) / (now - since) * (w - left), Y = (v) => (h - bottom) - (v - lo) / (hi - lo) * (h - bottom);
  if (axes) for (let k = 0; k <= 3; k++) { const v = lo + (hi - lo) * k / 3, y = Y(v);
    s.append(svg("line", { x1: left, x2: w, y1: y, y2: y, stroke: "var(--grid)", "stroke-width": 1 }));
    const lab = svg("text", { x: left - 4, y: y + 3, "text-anchor": "end", "font-size": 10, fill: "var(--muted)", "font-family": "var(--font-mono)" });
    lab.textContent = Math.abs(v) >= 100 ? v.toFixed(0) : v.toFixed(1); s.append(lab); }
  ids.forEach((id, n) => { const hs = history[id]; if (!hs) return; let d = "", pen = false;
    hs.t.forEach((t, i) => { const v = hs.v[i]; if (t < since || v == null) { pen = false; return; } d += (pen ? "L" : "M") + X(t).toFixed(1) + " " + Y(v).toFixed(1) + " "; pen = true; });
    s.append(svg("path", { d, fill: "none", stroke: colors[n], "stroke-width": 1.6, "stroke-linejoin": "round" })); });
}

function mix(a, b, t) {
  const p = (c) => (c.match(/[\d.]+/g) || [0, 0, 0, 1]).map(Number);
  const x = p(a), y = p(b), m = (i) => x[i] + ((y[i] ?? x[i]) - x[i]) * t;
  return `rgba(${m(0)},${m(1)},${m(2)},${x.length > 3 || y.length > 3 ? m(3) : 1})`;
}

setInterval(() => { if (state && !document.hidden) start(); }, 5 * 60 * 1000); // pick up dashboard edits
start();
</script>
